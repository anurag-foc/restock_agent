bundle:
  name: agentic_restock
  engine: direct # genie_spaces (the Genie Agent resource) require the direct deployment engine

include:
  - resources/*.yml
  - resources/**/*.yml

variables:
  catalog:
    description: >-
      Unity Catalog catalog name housing the artifacts we own outright (the
      section 4.2 UC functions and quote_metadata). Real inventory/consumption/
      procurement/restock-request data lives separately in Data Engineering's
      gold_dev star schema -- see src/agentic_restock/config.py (GOLD_CATALOG,
      DIM_SCHEMA, FACTS_SCHEMA) and docs/architecture.md §6.
    default: ab_training
  schema:
    description: Schema (database) name for the section 4.2 Unity Catalog functions and quote_metadata.
    default: agentic_restock

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://dbc-371e9acf-b9ec.cloud.databricks.com

  prod:
    mode: production
    workspace:
      host: https://dbc-371e9acf-b9ec.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
