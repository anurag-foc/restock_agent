command: ['npm', 'run', 'start']
env:
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: DATABRICKS_JOB_RESTOCK_DECISION
    valueFrom: restock-decision-job
  # AppKit's jobs() plugin manifest always registers a generic
  # DATABRICKS_JOB_ID resource requirement in addition to any named jobs
  # (see @databricks/appkit dist/plugins/jobs/manifest.js) -- without this,
  # startup fails validation even though the app only uses the named
  # `restock_decision` job via DATABRICKS_JOB_RESTOCK_DECISION above.
  # server.ts reads GOLD_CATALOG (default gold_dev) for the one endpoint that writes,
  # POST /api/lines/:lineKey/complete. The four SQL files under config/queries/ name the
  # catalog literally and were switched separately -- they are not covered by this.
  - name: GOLD_CATALOG
    value: "gold_dev_analytics"
  - name: DATABRICKS_JOB_ID
    valueFrom: restock-decision-job
