[project]
name = "agentic-restock"
version = "0.1.0"
description = "Agentic inventory restock workflow: Lakeflow trigger, Supervisor/Genie/Restock agents, Teams HITL, and Databricks Review App."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "databricks-sdk>=0.128.0",
    "mlflow>=3.15.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
