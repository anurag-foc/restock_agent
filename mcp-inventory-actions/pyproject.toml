# ============================================================================
# Project Metadata
# ============================================================================

[project]
name = "inventory-actions-mcp"
version = "0.1.0"
description = "Inventory Intelligence action tools (persist_quote, send_human_review, fulfill_restock_request) exposed as a custom MCP server on Databricks Apps."
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.12",
    "mcp[cli]>=1.14.0",
    "uvicorn>=0.34.2",
    "databricks-sdk>=0.60.0",
    "pydantic>=2",
    "fastmcp>=2.12.5",
    "requests>=2.31.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "databricks-sdk",
    "databricks-mcp",
    "pytest",
    "requests",
]

# ============================================================================
# Command Line Scripts
# ============================================================================

[project.scripts]
inventory-actions-mcp = "server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]

[tool.ruff]
line-length = 100
target-version = "py311"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = [
  "I",
  "B",
  "F401",
  "E722",
  "T203",
  "TC004",
  "TID251",
  "F403",
]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.pydocstyle]
convention = "google"
