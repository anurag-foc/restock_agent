resources:
  apps:
    mcp_inventory_actions:
      name: "mcp-inventory-actions"
      description: >-
        Custom MCP server exposing the Supervisor Agent's action tools:
        persist_quote, send_human_review. Attached to the Supervisor via the
        `app` tool type (app authorization), not a UC HTTP Connection -- see
        docs/agent_bricks_mapping.md. This is the ONLY thing that writes to
        fact_restock_request/quote_metadata or notifies Teams. It is the
        Supervisor's only tool -- see docs/redesign_tracker.md's Retirement
        section for why the Genie Spaces and fulfill_restock_request are gone.
      source_code_path: ../../mcp-inventory-actions

      lifecycle:
        started: true

      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: d2533a75c1bd9265
            permission: CAN_USE
        - name: teams-webhook
          secret:
            scope: restock-agent
            key: teams-webhook-url
            permission: READ
