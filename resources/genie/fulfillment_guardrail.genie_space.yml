resources:
  genie_spaces:
    fulfillment_guardrail:
      title: "Fulfillment Guardrail"
      warehouse_id: d2533a75c1bd9265
      file_path: ../../notebooks/genie/fulfillment_guardrail.geniespace.json
      description: >-
        Fulfillment-time guardrail. After a Production Manager approves a
        restock line, the Supervisor asks this space for a single verdict --
        PROCEED or NEEDS_REVIEW -- catching the case where a request sat
        PENDING_APPROVAL long enough that the stock situation already changed
        (replenished some other way, covered by a newer PO, demand
        collapsed) before it was approved. Deliberately read-only and never
        proposes a quantity -- the fulfill_restock_request MCP tool computes
        CONFIRMED_QTY/VARIANCE_QTY itself from live data and only needs the
        verdict.
      parent_path: /Workspace/Shared
