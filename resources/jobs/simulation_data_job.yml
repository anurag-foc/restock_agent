# On-demand generator for simulated inventory history.
#
# Inserts into gold_dev's existing fact tables. It is INSERT-ONLY: every write
# uses an explicit column list, and the notebook verifies each target's columns
# before writing. No CREATE OR REPLACE and no ALTER against a Data Engineering
# table; dimensions are read-only.
#
# The dry run has been validated, so this now applies for real: it DELETES the
# existing fact rows inside the generated date window before inserting. Set
# dry_run back to "true" for a report-only run. Re-running with the same `seed`
# reproduces the dataset byte for byte, making a backtest re-derivable.
resources:
  jobs:
    generate_sim_data:
      name: generate_sim_data
      description: >-
        Generates ~18 months of daily inventory snapshots, transactions and
        purchase orders into gold_dev, plus a sim_events ground-truth table
        recording every stockout, late supplier, dead-stock pair and surplus the
        generator planted. Dimensions are read, never written. Insert-only:
        no schema is altered. Deletes and replaces existing fact rows inside
        the generated date window.
      tasks:
        - task_key: generate_sim_data
          notebook_task:
            notebook_path: ../../notebooks/simulation/generate_sim_data.py
            base_parameters:
              target_catalog: gold_dev
              dim_schema: dim
              facts_schema: supply_chain_analytics
              days: "550"
              seed: "20260831"
              dry_run: "false"
              replace_window: "true"
