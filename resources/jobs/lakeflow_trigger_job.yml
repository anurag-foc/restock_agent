resources:
  jobs:
    lakeflow_trigger:
      name: "Manufacturing Inventory Intelligence Engine - Lakeflow Trigger"
      description: >-
        Multi-signal agentic scanner (§4.1) against Data Engineering's
        gold_dev.supply_chain_analytics.fact_inventory_snapshot (joined to
        gold_dev.dim.dim_part/dim_warehouse). Deep 4-layer intelligence analysis (§4.2)
        lives in Unity Catalog functions called by the Genie Agent and Supervisor Agent.
      schedule:
        quartz_cron_expression: "0 0 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      parameters:
        - name: supervisor_endpoint_name
          default: mas-486e7d15-endpoint
        - name: teams_webhook_url
          default: ""
      tasks:
        - task_key: coarse_check
          notebook_task:
            notebook_path: ../../notebooks/lakeflow_trigger/coarse_check.py

        - task_key: has_candidates
          depends_on:
            - task_key: coarse_check
          condition_task:
            left: "{{tasks.coarse_check.values.candidate_count}}"
            op: GREATER_THAN
            right: "0"

        - task_key: invoke_supervisor
          depends_on:
            - task_key: has_candidates
              outcome: "true"
          notebook_task:
            notebook_path: ../../notebooks/lakeflow_trigger/invoke_supervisor.py
            base_parameters:
              supervisor_endpoint_name: "{{job.parameters.supervisor_endpoint_name}}"
              teams_webhook_url: "{{job.parameters.teams_webhook_url}}"
      tags:
        project: agentic_restock
        purpose: lakeflow-trigger
