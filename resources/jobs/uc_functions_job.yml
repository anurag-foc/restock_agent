resources:
  jobs:
    deploy_uc_functions:
      name: "Inventory Intelligence - Deploy UC Functions"
      description: >-
        On-demand job that (re)registers the 16 deep-analysis UC SQL
        functions from the pre-redesign §4.2 tier. Only 4 of them
        (pending_procurement_qty, requested_restock_qty,
        predicted_stockout_date, avg_daily_consumption) are still called by
        anything -- apply_decision's advisory check calls
        pending_procurement_qty directly by SQL, no Genie involved. The other
        12 stay deployed for ad-hoc SQL-editor debugging, unattached to any
        Genie Space or Supervisor tool. The phase-1 signal board and its 8
        priority functions, plus both Genie Spaces that used to sit in front
        of these functions, were retired along with the phase-1 pipeline --
        see docs/redesign_tracker.md's Retirement section. CREATE OR REPLACE,
        idempotent. Run manually after schema_bootstrap.
      tasks:
        - task_key: deploy_functions
          notebook_task:
            notebook_path: ../../notebooks/uc_functions/deep_analysis_functions.ipynb
      permissions:
        - group_name: agentbricks-users
          level: CAN_MANAGE
      tags:
        project: agentic_restock
        purpose: uc-functions-deploy
