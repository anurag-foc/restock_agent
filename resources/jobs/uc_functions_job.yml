resources:
  jobs:
    deploy_uc_functions:
      name: "Restockify - Deploy UC Functions"
      description: >-
        On-demand job that (re)registers the §4.2 deep-analysis logic as
        Unity Catalog SQL functions in ${var.catalog}.${var.schema}
        (avg_daily_consumption, predicted_stockout_date, classify_urgency,
        requested_restock_qty, pending_procurement_qty, open_procurement_orders,
        restock_candidate_summary, avg_lead_time_days, latest_snapshot).
        Function bodies read Data Engineering's real gold_dev.dim /
        gold_dev.supply_chain_analytics star schema, not mock tables. Run
        manually after schema_bootstrap. There is deliberately no single
        needs_restock boolean function — the restock veto is computed by
        comparing requested_restock_qty against pending_procurement_qty (see
        the Genie Space's text_instructions). These functions are the trusted
        assets the Genie Agent calls — see docs/agent_bricks_mapping.md.
      tasks:
        - task_key: deploy_functions
          notebook_task:
            notebook_path: ../../notebooks/uc_functions/deep_analysis_functions.ipynb
      tags:
        project: agentic_restock
        purpose: uc-functions-deploy
