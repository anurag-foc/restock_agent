resources:
  jobs:
    restock_decision:
      name: "Inventory Intelligence - Restock Decision"
      description: >-
        On-demand job triggered by the restock-review app's Final Submit
        button, which batches every part-line a Production Manager staged an
        approve/reject decision (and optional note) for on one quote
        (architecture §5/§7). ONE task now: it applies the status change for
        every line in the batch deterministically, with no LLM anywhere in the
        path. An approval goes straight to FULFILLING at the proposed
        quantity.

        There used to be a second task. It opened one Supervisor conversation
        per approved line and asked the fulfillment_guardrail Genie Space to
        re-check live stock before acting. That check was purchase-shaped, and
        most of what this system now finds is not a purchase -- re-checking
        stock says nothing about RECALIBRATE, REVIEW_STOCK, or the three
        supplier-grain finding types. The one case it genuinely caught (a
        purchase approved days later, already covered by an open PO) is now a
        deterministic advisory inside apply_decision.

        Still a job rather than inline in the app because the Databricks Apps
        reverse proxy hard-caps requests at 120s.

        No job-level `parameters:` here deliberately: the app triggers this
        job via AppKit's jobs() plugin, which for taskType="notebook" always
        sends legacy notebook_params, and the Jobs API rejects notebook_params
        on a job that has job-level parameters configured (must use
        job_parameters instead). Passing decisions_json straight through as a
        notebook_param override on apply_decision's base_parameters sidesteps
        that. This job no longer calls the Supervisor at all, so it is not in
        scripts/ensure_supervisor_agent.py's JOB_YAMLS list any more.
      tasks:
        - task_key: apply_decision
          notebook_task:
            notebook_path: ../../notebooks/restock_decision/apply_decision.py
            base_parameters:
              decisions_json: "[]"
              # The redesign's quotes live on the replica. base_parameters (not a job-level
              # parameter) for the reason in the description above.
              gold_catalog: gold_dev_analytics

      tags:
        project: agentic_restock
        purpose: restock-decision
